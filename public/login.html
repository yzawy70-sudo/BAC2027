<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | BAC 2027</title>

    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>

    <main class="auth-page">

        <!-- الخلفية -->
        <div class="background-overlay"></div>

        <!-- شعار الموقع -->
        <a href="/" class="brand">
            <div class="brand-logo">B27</div>

            <div class="brand-text">
                <strong>BAC 2027</strong>
                <span>طريقك نحو النجاح</span>
            </div>
        </a>

        <!-- بطاقة تسجيل الدخول -->
        <section class="auth-card">

            <div class="auth-header">
                <span class="welcome-icon">👋</span>

                <h1>مرحبًا بعودتك</h1>

                <p>
                    سجّل الدخول لمتابعة رحلتك نحو بكالوريا 2027
                </p>
            </div>

            <form id="loginForm">

                <!-- البريد -->
                <div class="input-group">
                    <label for="email">البريد الإلكتروني</label>

                    <div class="input-wrapper">
                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="أدخل بريدك الإلكتروني"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <!-- كلمة المرور -->
                <div class="input-group">
                    <div class="password-label">
                        <label for="password">كلمة المرور</label>

                        <a href="#" class="forgot-password">
                            نسيت كلمة المرور؟
                        </a>
                    </div>

                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="أدخل كلمة المرور"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="togglePassword"
                            aria-label="إظهار كلمة المرور"
                        >
                            👁
                        </button>
                    </div>
                </div>

                <!-- تذكرني -->
                <label class="remember-me">
                    <input type="checkbox" id="remember">
                    <span>تذكرني</span>
                </label>

                <!-- رسالة الخطأ -->
                <div id="loginMessage" class="message"></div>

                <!-- تسجيل الدخول -->
                <button type="submit" class="login-button">
                    <span>تسجيل الدخول</span>
                    <span class="arrow">←</span>
                </button>

            </form>

            <!-- إنشاء حساب -->
            <div class="register-link">
                ليس لديك حساب؟
                <a href="/register">إنشاء حساب جديد</a>
            </div>

        </section>

        <!-- معلومات البكالوريا -->
        <div class="exam-info">
            <span>🎓</span>

            <div>
                <strong>بكالوريا 2027</strong>
                <small>07 جوان 2027</small>
            </div>
        </div>

        <footer>
            <span>© 2026 BAC 2027</span>
            <span>•</span>
            <span>منصة تعليمية لطلاب الجزائر</span>
        </footer>

    </main>

    <script src="/js/auth.js"></script>

</body>
</html>
